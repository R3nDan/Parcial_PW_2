<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar médico · Consultas médicas</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark small">+</span> Consultas médicas</a><nav><a class="active" href="/admin">Administración</a></nav><form th:action="@{/logout}" method="post"><button class="button ghost">Cerrar sesión</button></form></header><main class="container"><div class="heading"><div><p class="eyebrow">DIRECTORIO MÉDICO</p><h1>Editar médico</h1><p class="muted">Actualiza los datos del profesional.</p></div><span class="role-pill">ADMINISTRADOR</span></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="card" style="max-width:700px"><form th:action="@{/admin/medicos/{id}/editar(id=${medico.id})}" th:object="${medico}" method="post" class="form-grid"><label>Nombre completo<input th:field="*{nombre}" maxlength="80" required></label><label>Especialidad<input th:field="*{especialidad}" maxlength="80" required></label><label>Usuario de acceso<input th:field="*{usuario}" minlength="3" maxlength="40" required></label><p class="muted">La contraseña actual se conserva.</p><div class="form-actions"><a class="button ghost" href="/admin">Cancelar</a><button class="button primary" type="submit">Guardar cambios</button></div></form></section></main></body></html>
