<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis consultas · Consultas médicas</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark small">+</span> Consultas médicas</a><nav><a class="active" href="/medico">Mis consultas</a></nav><form th:action="@{/logout}" method="post"><button class="button ghost">Cerrar sesión</button></form></header><main class="container"><div class="heading"><div><p class="eyebrow">ÁREA MÉDICA</p><h1>Consultas asignadas</h1><p class="muted">Aquí solo aparecen las consultas asignadas a tu usuario.</p></div><span class="role-pill">MÉDICO</span></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Paciente</th><th>Motivo</th><th>Consultorio</th><th>Horario</th></tr></thead><tbody><tr th:each="c : ${consultas}"><td th:text="${c.pacienteNombre}"></td><td th:text="${c.motivo}"></td><td th:text="${c.consultorio}"></td><td th:text="${#temporals.format(c.inicio, 'dd/MM/yyyy HH:mm') + ' – ' + #temporals.format(c.fin, 'HH:mm')}"></td></tr><tr th:if="${#lists.isEmpty(consultas)}"><td colspan="4" class="empty">No tienes consultas asignadas.</td></tr></tbody></table></div></section></main></body></html>
